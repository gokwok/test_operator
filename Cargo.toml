[workspace]
members = [
    "crates/operator-agent",
    "crates/operator-cli",
    "crates/operator-core",
    "crates/operator-mcp",
    "crates/operator-platform-macos",
    "crates/operator-runtime",
    "crates/operator-testkit",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1.89"
clap = { version = "4.5.37", features = ["derive"] }
schemars = "0.8.22"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.140"
tempfile = "3.19.1"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
uuid = { version = "1.16.0", features = ["serde", "v4"] }
